<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Official Zoology MQAR carrier comparison</title>
<style>
  :root { font-family: Inter, system-ui, sans-serif; color: #17202a; background: #f5f7f8; }
  body { margin: 0; }
  header { padding: 24px max(20px,5vw) 16px; background: #fff; border-bottom: 1px solid #d7dfe3; }
  h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
  p { margin: 8px 0 0; color: #58656d; }
  main { max-width: 1080px; margin: 0 auto; padding: 22px 20px 36px; }
  canvas { display: block; width: 100%; height: 430px; background: #fff; border: 1px solid #d7dfe3; }
  .legend { display: flex; flex-wrap: wrap; gap: 22px; margin: 14px 0 22px; }
  .key::before { content: ""; display: inline-block; width: 18px; height: 3px; margin: 0 8px 3px 0; background: var(--c); }
  table { width: 100%; border-collapse: collapse; background: #fff; font-variant-numeric: tabular-nums; }
  th,td { padding: 11px 12px; text-align: right; border-bottom: 1px solid #e1e7ea; }
  th:first-child,td:first-child { text-align: left; }
  .pass { color: #006d77; font-weight: 700; }
</style>
</head>
<body>
<header><h1>GDN2 opens official MQAR in two epochs</h1><p>Same upstream data, Trainer, loss, seed, and stopping rule. Only the sequence mixer changes.</p></header>
<main>
  <canvas id="chart" width="1080" height="430" aria-label="Validation accuracy by epoch for official MHA and GDN2"></canvas>
  <div class="legend"><span class="key" style="--c:#006d77">Strict GDN2</span><span class="key" style="--c:#c2410c">Official MHA</span><span>Dashed line: 0.99 gate</span></div>
  <table><thead><tr><th>Mixer</th><th>Epoch 0</th><th>Epoch 1</th><th>Epoch 2</th><th>Gate epoch</th></tr></thead><tbody>
    <tr><td>Official MHA</td><td>0.246</td><td>0.250</td><td>0.259</td><td>25</td></tr>
    <tr><td>Strict official GDN2</td><td>0.242</td><td>0.984</td><td class="pass">0.9965</td><td class="pass">2</td></tr>
  </tbody></table>
</main>
<script>
const mha=[[0,.246],[1,.25],[2,.259],[3,.258],[4,.257],[5,.265],[6,.256],[7,.255],[8,.265],[9,.258],[10,.259],[11,.259],[12,.267],[13,.259],[14,.266],[15,.256],[16,.258],[17,.262],[18,.272],[19,.268],[20,.279],[21,.292],[22,.368],[23,.965],[24,.99],[25,.99775]];
const gdn=[[0,.242],[1,.984],[2,.9965]];
const c=document.querySelector('#chart'),x=c.getContext('2d'),m={l:58,r:25,t:24,b:44},w=c.width-m.l-m.r,h=c.height-m.t-m.b;
x.font='13px system-ui';x.fillStyle='#647078';x.strokeStyle='#dfe5e8';x.lineWidth=1;
for(let i=0;i<=5;i++){const y=m.t+h-i*h/5;x.beginPath();x.moveTo(m.l,y);x.lineTo(m.l+w,y);x.stroke();x.fillText((i/5).toFixed(1),16,y+4)}
for(let i=0;i<=25;i+=5){const px=m.l+i*w/25;x.fillText(String(i),px-6,m.t+h+28)}
const gate=m.t+(1-.99)*h;x.save();x.setLineDash([7,6]);x.strokeStyle='#707b81';x.beginPath();x.moveTo(m.l,gate);x.lineTo(m.l+w,gate);x.stroke();x.restore();
function draw(rows,color){x.strokeStyle=color;x.lineWidth=3;x.beginPath();rows.forEach((r,i)=>{const px=m.l+r[0]*w/25,py=m.t+(1-r[1])*h;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();rows.forEach(r=>{x.fillStyle=color;x.beginPath();x.arc(m.l+r[0]*w/25,m.t+(1-r[1])*h,4,0,Math.PI*2);x.fill()})}
draw(mha,'#c2410c');draw(gdn,'#006d77');x.fillStyle='#17202a';x.fillText('epoch',m.l+w/2,m.t+h+40);
</script>
</body>
</html>
